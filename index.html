<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão SARESP · Inglês</title>
<meta name="description" content="Revisão de Língua Inglesa para o SARESP 2026 · 6º ao 9º ano · E.E. José Roberto Friebolin · Prof. Carlos Augusto">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1f2430; --muted:#5b6170; --line:#e3ded3;
  --brand:#1f6f78; --brand-2:#e9f3f3; --accent:#e8833a; --accent-2:#fdf0e4;
  --ok:#1e8a4c; --ok-bg:#e6f5ec; --bad:#c0392b; --bad-bg:#fbeae8; --warn:#8a5d00; --warn-bg:#fff6dc;
  --board:#24433a; --chalk:#f4f1e6; --shadow:0 2px 10px rgba(30,30,40,.07);
  --ano:#1f6f78;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d; --card:#20232b; --ink:#eceef2; --muted:#a6acb9; --line:#343845;
    --brand:#5fc2cc; --brand-2:#1d3337; --accent:#f0a160; --accent-2:#3a2a1c;
    --ok:#5cd18f; --ok-bg:#183326; --bad:#ff8a7d; --bad-bg:#3a1f1c; --warn:#f3c95c; --warn-bg:#352c13;
    --board:#1c332c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d; --card:#20232b; --ink:#eceef2; --muted:#a6acb9; --line:#343845;
  --brand:#5fc2cc; --brand-2:#1d3337; --accent:#f0a160; --accent-2:#3a2a1c;
  --ok:#5cd18f; --ok-bg:#183326; --bad:#ff8a7d; --bad-bg:#3a1f1c; --warn:#f3c95c; --warn-bg:#352c13;
  --board:#1c332c; --shadow:none;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
header{background:var(--ano);color:#fff;padding:14px 16px;transition:background .3s}
header .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:1.2rem;margin:0;flex:1;min-width:180px}
header small{display:block;font-weight:400;opacity:.9;font-size:.8rem}
.tool{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:.9rem;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav .wrap{display:flex;gap:4px;padding:6px 12px}
nav button{border:0;background:none;color:var(--muted);font-size:1rem;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
nav button.on{background:var(--brand-2);color:var(--brand)}
.wrap{max-width:880px;margin:0 auto}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px;box-shadow:var(--shadow)}
h2{font-size:1.35rem;margin:.1rem 0 .5rem}
h3{font-size:1.05rem;margin:0 0 .4rem}
.tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-2);color:var(--accent);padding:3px 9px;border-radius:99px;margin-bottom:6px}
.muted{color:var(--muted)}
.lousa{background:var(--board);color:var(--chalk);border-radius:12px;padding:14px 16px;margin:10px 0 14px;border:6px solid #8a6a43;font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:1.25rem;line-height:1.45}
.lousa .lt{font-family:inherit;font-size:.8rem;letter-spacing:.06em;opacity:.75;text-transform:uppercase;margin-bottom:4px}
.lousa ol{margin:0;padding-left:1.3rem}
.pega{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600}
.prof{display:none;background:var(--brand-2);border-left:4px solid var(--brand);border-radius:10px;padding:10px 14px;margin:10px 0}
body.modo-prof .prof{display:block}
.prof b{color:var(--brand)}
.prof ul{margin:.3rem 0 0;padding-left:1.2rem}
.topicos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tbtn{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:1rem}
.tbtn:hover{border-color:var(--ano)}
.tbtn b{display:block}
.tbtn .done{float:right;color:var(--ok);font-weight:800}
.q{border-top:1px dashed var(--line);padding:14px 0}
.q:first-of-type{border-top:0}
.cmd{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--accent-2);color:var(--accent);margin-bottom:6px}
.stem{font-size:1.02rem;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:1rem;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;border-radius:10px;padding:8px 12px;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{border:0;background:var(--ano);color:#fff;border-radius:10px;padding:10px 16px;font-size:1rem;font-weight:700;cursor:pointer}
.btn.sec{background:var(--brand-2);color:var(--brand)}
.score{font-weight:800;font-size:1.1rem}
.voltar{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:0;font-size:1rem;margin-bottom:8px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 16px 40px}
@media (max-width:520px){html{font-size:16px}.lousa{font-size:1.12rem}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📚 Revisão SARESP · Inglês <small>E.E. José Roberto Friebolin · Prof. Carlos Augusto</small></h1>
    <button class="tool" id="tema" aria-label="Mudar tema">🌓</button>
  </div>
</header>
<nav><div class="wrap" id="nav"></div></nav>
<main><div class="wrap" id="app"></div></main>
<footer>Questões inspiradas nos itens da Prova Paulista e nos descritores do SARESP · 2026</footer>

<script src="dados.js"></script>
<script>
const PROF = new URLSearchParams(location.search).has("prof");
if (PROF) document.body.classList.add("modo-prof");

function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
const temaBtn=document.getElementById("tema");
const temaSalvo=store("tema"); if(temaSalvo) document.documentElement.dataset.theme=temaSalvo;
temaBtn.onclick=()=>{const atual=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const novo=atual==="dark"?"light":"dark"; document.documentElement.dataset.theme=novo; store("tema",novo);};

const nav=document.getElementById("nav"), app=document.getElementById("app");
const ABAS=[["inicio","🏁 Comece aqui"],["6","6º ano"],["7","7º ano"],["8","8º ano"],["9","9º ano"]];
nav.innerHTML=ABAS.map(([id,t])=>`<button data-id="${id}">${t}</button>`).join("");
nav.onclick=e=>{const b=e.target.closest("button"); if(b) ir(b.dataset.id);};

function lousaHTML(l){return `<div class="lousa"><div class="lt">✏️ Copie no caderno</div><ol>${l.map(x=>`<li>${x}</li>`).join("")}</ol></div>`}
function profHTML(p){return `<div class="prof"><b>👨‍🏫 Roteiro do professor</b><ul>${p.map(x=>`<li>${x}</li>`).join("")}</ul></div>`}
function feitos(){try{return JSON.parse(store("feitos")||"{}")}catch(e){return {}}}

function quizHTML(qs,id){
  return `<div class="card"><h3>🎯 Treine como no SARESP</h3>${qs.map((q,i)=>`
    <div class="q" data-i="${i}">
      <span class="cmd">${q.t==="two"?"MARQUE DUAS":"MARQUE UMA"}</span>
      <div class="stem">${i+1}) ${q.s}</div>
      <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${"ABCD"[j]}) ${o}</button>`).join("")}</div>
      <div class="row"><button class="btn sec conf">Conferir</button></div>
      <div class="fb"></div>
    </div>`).join("")}
    <div class="row"><span class="score" id="score"></span></div></div>`;
}
function ligarQuiz(qs,id){
  let acertos=0, respondidas=0;
  app.querySelectorAll(".q").forEach(div=>{
    const q=qs[+div.dataset.i], sel=new Set();
    div.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j;
      if(sel.has(j)){sel.delete(j);b.classList.remove("sel");return;}
      if(q.t==="one"){sel.clear();div.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));}
      else if(sel.size>=2) return;
      sel.add(j); b.classList.add("sel");
    });
    div.querySelector(".conf").onclick=function(){
      const fb=div.querySelector(".fb"), precisa=q.t==="two"?2:1;
      if(sel.size<precisa){fb.className="fb bad";fb.textContent=q.t==="two"?"⚠️ Esta pede DUAS alternativas! Marque mais uma.":"Escolha uma alternativa.";return;}
      const certo=q.a.length===sel.size&&q.a.every(x=>sel.has(x));
      div.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.j;b.disabled=true;
        if(q.a.includes(j))b.classList.add("ok"); else if(sel.has(j))b.classList.add("bad");});
      fb.className="fb "+(certo?"ok":"bad"); fb.innerHTML=(certo?"✅ Isso! ":"❌ Quase. ")+q.e;
      this.remove(); respondidas++; if(certo)acertos++;
      if(respondidas===qs.length){
        document.getElementById("score").textContent=`Você acertou ${acertos} de ${qs.length}. ${acertos===qs.length?"🏆 Perfeito!":"Revise o esquema da lousa e tente de novo!"}`;
        const f=feitos(); f[id]=Math.max(f[id]||0,acertos); store("feitos",JSON.stringify(f));
      }
    };
  });
}

function inicio(){
  document.documentElement.style.setProperty("--ano","#1f6f78");
  const A=ARMADILHAS;
  app.innerHTML=`
  <div class="card"><span class="tag">Antes de tudo</span><h2>${A.titulo}</h2>${A.texto}${lousaHTML(A.lousa)}${profHTML(A.prof)}</div>
  <div class="card"><h3>Como usar este site</h3>
    <p>1. Escolha o seu <b>ano</b> lá em cima.<br>2. Abra um assunto e leia a explicação.<br>3. Copie <b>só o quadro verde</b> no caderno — são 3 linhas.<br>4. Faça o treino e confira na hora.</p>
    <p class="muted">Dica: nas questões que pedem <b>DUAS</b>, o site avisa se você marcar só uma. Na prova, ninguém avisa! 😉</p>
  </div>${quizHTML(A.quiz,"armadilhas")}`;
  ligarQuiz(A.quiz,"armadilhas");
}

function ano(n){
  const A=ANOS[n], f=feitos();
  document.documentElement.style.setProperty("--ano",A.cor);
  app.innerHTML=`<div class="card"><span class="tag">SARESP · ${A.nome}</span><h2>O que cai na prova</h2>
    <p class="muted">Toque em um assunto. Comece pelo primeiro e vá descendo.</p>
    <div class="topicos">${A.topicos.map((t,i)=>`<button class="tbtn" data-id="${t.id}">${f[t.id]!==undefined?`<span class="done">✓ ${f[t.id]}/3</span>`:""}<span class="muted">${i+1}. ${t.tag}</span><b>${t.titulo}</b></button>`).join("")}</div></div>`;
  app.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>ir(n+"/"+b.dataset.id));
}

function topico(n,id){
  const A=ANOS[n], t=A.topicos.find(x=>x.id===id); if(!t) return ano(n);
  document.documentElement.style.setProperty("--ano",A.cor);
  const i=A.topicos.indexOf(t), prox=A.topicos[i+1];
  app.innerHTML=`<button class="voltar">← ${A.nome}</button>
  <div class="card"><span class="tag">${t.tag}</span><h2>${t.titulo}</h2>
    ${lousaHTML(t.lousa)}${t.texto}<div class="pega">⚠️ Pegadinha: ${t.pega}</div>${profHTML(t.prof)}</div>
  ${quizHTML(t.quiz,t.id)}
  ${prox?`<div class="row"><button class="btn" id="prox">Próximo: ${prox.titulo} →</button></div>`:""}`;
  app.querySelector(".voltar").onclick=()=>ir(n);
  if(prox) document.getElementById("prox").onclick=()=>ir(n+"/"+prox.id);
  ligarQuiz(t.quiz,t.id);
}

function ir(rota){ location.hash=rota; }
function render(){
  const r=(location.hash.slice(1)||"inicio").split("/");
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===r[0]));
  if(ANOS[r[0]]) r[1]?topico(r[0],r[1]):ano(r[0]); else inicio();
  scrollTo(0,0);
}
addEventListener("hashchange",render); render();
</script>
</body>
</html>
